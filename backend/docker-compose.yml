services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bhoomisetu}
      POSTGRES_USER: ${POSTGRES_USER:-bhoomisetu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bhoomisetu_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bhoomisetu} -d ${POSTGRES_DB:-bhoomisetu}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: .
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://bhoomisetu:bhoomisetu_dev@db:5432/bhoomisetu?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
