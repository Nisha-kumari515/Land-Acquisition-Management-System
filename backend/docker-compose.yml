services:
  db: 
  
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: bhoomisetu
      POSTGRES_USER: bhoomisetu
      POSTGRES_PASSWORD: bhoomisetu_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bhoomisetu -d bhoomisetu"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://bhoomisetu:bhoomisetu_dev@db:5432/bhoomisetu?schema=public
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
